#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M
kotlin.build.report.output=file
kotlin.suppressGradlePluginErrors=PrecompiledScriptPluginInGradleWrapper
kotlin.mpp.androidTarget.suppressDeprecationWarning=true
kotlin.suppressAllKotlinCompilationWarnings=true
# Needed so the custom TensorFlowLiteTaskVision cinterop (declared per-leaf
# target: iosArm64/iosSimulatorArm64) is visible from the shared iosMain
# intermediate source set - without this, code in iosMain can't see it
# even though both leaf targets declare the identical cinterop.
kotlin.mpp.enableCInteropCommonization=true

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.warning.mode=none

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
# Allow duplicate namespaces for TensorFlow Lite libraries
android.uniquePackageNames=false